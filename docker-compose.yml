services:
  mongodb:
    image: mongo:latest
    container_name: gradewise_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:latest
    container_name: gradewise_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongo_data:
